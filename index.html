<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LogReady365</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"] {
      --bg:#f4f3ef;
      --surface:#fbfaf7;
      --surface-2:#f2efe9;
      --surface-3:#e9e4db;
      --text:#1f1d18;
      --muted:#726d64;
      --faint:#a8a39a;
      --line:rgba(31,29,24,.10);
      --primary:#0c6e70;
      --primary-2:#d8ecea;
      --success:#437a22;
      --warning:#b7791f;
      --danger:#b24b3c;
      --info:#2b6cb0;
      --shadow-sm:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(24,22,17,.04);
      --shadow-md:0 4px 16px rgba(0,0,0,.05),0 18px 48px rgba(24,22,17,.08);
      --radius-sm:12px;
      --radius-md:18px;
      --radius-lg:24px;
      --radius-xl:32px;
      --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;
    }
    [data-theme="dark"] {
      --bg:#171614;
      --surface:#1d1c1a;
      --surface-2:#242320;
      --surface-3:#2b2a26;
      --text:#ede8de;
      --muted:#aaa398;
      --faint:#6f695f;
      --line:rgba(255,255,255,.10);
      --primary:#4f9ca1;
      --primary-2:#243a3b;
      --success:#79b85a;
      --warning:#e1b35d;
      --danger:#dd7c72;
      --info:#7fb5e7;
      --shadow-sm:0 1px 2px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.18);
      --shadow-md:0 4px 16px rgba(0,0,0,.26),0 18px 48px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:none;text-size-adjust:none;scroll-behavior:smooth}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    button,input,textarea,select{font:inherit;color:inherit}
    img,svg{display:block;max-width:100%}
    .app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:108px}
    .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px 18px 14px}
    .topbar-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-md)}
    .brand h1{font-size:18px;line-height:1.1;letter-spacing:-.03em;margin:0}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .top-actions{display:flex;gap:8px}
    .icon-btn{width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
    main{padding:18px;display:grid;gap:16px}
    .page{display:none;gap:16px}
    .page.active{display:grid}
    .hero,.card,.list-row,.sheet,.timeline-item,.metric,.doc-row,.mini-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
    .hero,.card,.sheet{border-radius:var(--radius-lg)}
    .hero{padding:18px;display:grid;gap:16px}
    .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
    .hero h2{margin:0;font-size:30px;line-height:1.02;letter-spacing:-.05em}
    .hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .cta-row,.filter-row,.seg-row,.tab-row,.inline-actions,.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn,.btn-soft,.btn-ghost,.pill,.seg-btn,.tab-btn{min-height:44px;border-radius:999px;padding:0 16px;border:1px solid transparent;cursor:pointer}
    .btn{background:var(--primary);color:#fff;font-weight:700}
    .btn-soft{background:var(--primary-2);color:var(--primary);font-weight:700}
    .btn-ghost{background:transparent;border-color:var(--line);font-weight:600}
    .pill{background:var(--surface-2);border-color:var(--line);font-size:12px;min-height:36px;padding:0 12px}
    .section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
    .section-head h3{margin:0;font-size:18px;letter-spacing:-.03em}
    .section-head p,.subtle{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .card{padding:16px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .metric{padding:12px;border-radius:16px;background:var(--surface-2)}
    .metric strong{display:block;font-size:20px;letter-spacing:-.03em}
    .metric span{color:var(--muted);font-size:12px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .mini-card{padding:14px;border-radius:16px;background:var(--surface-2)}
    .mini-card strong{display:block;margin-bottom:4px}
    .list{display:grid;gap:10px}
    .list-row{border-radius:18px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
    .avatar{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--primary)}
    .list-row h4{margin:0 0 4px;font-size:15px}
    .list-row p,.list-row small{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .status{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
    .green{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
    .amber{background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--warning)}
    .red{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
    .blue{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
    .kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;margin-bottom:6px}
    .sheet{padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 96%,#fff 4%),color-mix(in srgb,var(--primary) 88%,#000 12%));color:#fff}
    .sheet h3,.sheet p{margin:0}
    .sheet .subtle{color:rgba(255,255,255,.82)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}
    th{color:var(--muted);background:var(--surface-2)}
    .search{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
    .field{display:grid;gap:8px}
    .field label{font-size:13px;font-weight:600}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
    .field textarea{min-height:92px;resize:vertical}
    .stack{display:grid;gap:12px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:calc(100% - 24px);max-width:406px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border-radius:22px;box-shadow:var(--shadow-md);z-index:40}
    .nav-btn{min-height:58px;border:none;border-radius:16px;background:transparent;color:var(--muted);display:grid;place-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer}
    .nav-btn.active{background:var(--primary);color:#fff}
    .fab{position:fixed;right:max(18px,calc(50% - 430px/2 + 18px));bottom:88px;width:58px;height:58px;border-radius:18px;border:none;background:var(--text);color:var(--bg);box-shadow:var(--shadow-md);font-size:28px;cursor:pointer;z-index:39}
    .drawer{position:fixed;inset:0;background:rgba(10,10,10,.42);display:none;align-items:end;justify-content:center;padding:12px;z-index:50}
    .drawer.show{display:flex}
    .modal{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow-md);display:grid;gap:14px}
    .modal h3,.modal p{margin:0}
    .seg-btn,.tab-btn{background:var(--surface-2);border-color:var(--line);font-weight:700;color:var(--muted)}
    .seg-btn.active,.tab-btn.active{background:var(--primary);color:#fff;border-color:transparent}
    .helper{font-size:12px;color:var(--muted)}
    .empty{padding:20px;border-radius:18px;background:var(--surface-2);text-align:center;color:var(--muted)}
    .folder{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
    .folder strong{display:block}
    .badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700}
    .timeline{display:grid;gap:12px}
    .timeline-item{padding:14px;border-radius:18px}
    .flow{display:grid;gap:8px}
    .flow-step{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
    .hidden{display:none!important}
    @media (min-width:768px){body{padding:24px}.app{max-width:1180px;padding-bottom:24px}.topbar{border-radius:24px 24px 0 0}.shell{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}.desktop-side{display:grid;gap:14px;position:sticky;top:100px}.bottom-nav,.fab{display:none}.page-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.page-grid.full{grid-template-columns:1fr}.hero h2{font-size:42px}}
    .desktop-side{display:none}
    @media (min-width:768px){.desktop-side{display:grid}}
  </style>
</head>
<body>
<div class="app" id="appRoot">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 12.4l3.1 3.1L17.4 8.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" stroke="currentColor" stroke-width="1.7"/></svg>
        </div>
        <div>
          <h1>LogReady365</h1>
          <p>Food truck compliance made inspection-ready</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button>
        <button class="icon-btn" id="quickExportTop" aria-label="Export daily report">⇩</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <aside class="desktop-side">
      <div class="card">
        <div class="section-head"><div><h3>Today</h3><p>Fastest routes for busy operators.</p></div></div>
        <div class="stack" id="desktopQuickNav"></div>
      </div>
      <div class="card">
        <div class="section-head"><div><h3>Inspection pulse</h3><p>At-a-glance system status.</p></div></div>
        <div class="grid-2" id="desktopPulse"></div>
      </div>
    </aside>

    <section>
      <section class="page active" id="page-home"></section>
      <section class="page" id="page-tasks"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-documents"></section>
      <section class="page" id="page-more"></section>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button class="nav-btn active" data-page="home">Home</button>
    <button class="nav-btn" data-page="tasks">Tasks</button>
    <button class="nav-btn" data-page="logs">Logs</button>
    <button class="nav-btn" data-page="documents">Docs</button>
    <button class="nav-btn" data-page="more">More</button>
  </nav>
  <button class="fab" id="fabBtn" aria-label="Quick add">+</button>
</div>

<div class="drawer" id="drawer">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Quick add</h3>
    <p class="helper">Capture the most frequent compliance action in a few taps.</p>
    <div class="seg-row" id="quickTypeRow">
      <button class="seg-btn active" data-quick="temp">Temp</button>
      <button class="seg-btn" data-quick="clean">Cleaning</button>
      <button class="seg-btn" data-quick="hygiene">Hygiene</button>
      <button class="seg-btn" data-quick="batch">Batch</button>
    </div>
    <div class="field">
      <label for="quickName">Entry</label>
      <input id="quickName" placeholder="e.g. Fridge 1" />
    </div>
    <div class="split">
      <div class="field">
        <label for="quickValue">Value</label>
        <input id="quickValue" placeholder="e.g. 4°C / Completed / B-1042" />
      </div>
      <div class="field">
        <label for="quickOwner">Owner</label>
        <select id="quickOwner"></select>
      </div>
    </div>
    <div class="field">
      <label for="quickNotes">Notes</label>
      <textarea id="quickNotes" placeholder="Optional notes or corrective action context"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="closeDrawer">Cancel</button>
      <button class="btn" id="saveQuick">Save entry</button>
    </div>
  </div>
</div>

<script>
const state = {
  theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
  currentPage: 'home',
  quickType: 'temp',
  truck: {
    name: 'Cinder & Salt',
    concept: 'Gourmet street grill',
    location: 'Dublin City Centre',
    riskLevel: 'Medium',
    serviceWindow: '11:00–20:00'
  },
  team: [
    { id: 1, name: 'Mark O’Neill', role: 'Owner-operator', docsExpiring: 0 },
    { id: 2, name: 'Leah Byrne', role: 'Shift lead', docsExpiring: 1 },
    { id: 3, name: 'Tom Silva', role: 'Prep & hygiene', docsExpiring: 0 }
  ],
  tasks: [
    { id: 1, title: 'Opening hygiene check', type: 'Hygiene', due: '09:00', status: 'due', owner: 'Leah Byrne', notes: 'Handwash sink, soap, towels, bins.' },
    { id: 2, title: 'Fridge 1 temperature', type: 'Temperature', due: '09:10', status: 'due', owner: 'Tom Silva', notes: 'Critical limit 0–5°C.' },
    { id: 3, title: 'Hot hold probe check', type: 'CCP', due: '12:00', status: 'attention', owner: 'Mark O’Neill', notes: 'Maintain above 63°C.' },
    { id: 4, title: 'Closing clean-down', type: 'Cleaning', due: '20:10', status: 'upcoming', owner: 'Leah Byrne', notes: 'Surfaces, handles, drains, waste.' }
  ],
  logs: [
    { id: 1, category: 'Temperature', entry: 'Freezer A', value: '-18°C', owner: 'Tom Silva', time: '09:02', batch: 'B-1040', verified: true },
    { id: 2, category: 'Cleaning', entry: 'Prep surface sanitised', value: 'Completed', owner: 'Leah Byrne', time: '08:51', batch: '-', verified: true },
    { id: 3, category: 'Hygiene', entry: 'Opening hygiene check', value: 'Completed', owner: 'Leah Byrne', time: '08:44', batch: '-', verified: false },
    { id: 4, category: 'Temperature', entry: 'Fridge 1', value: '7°C', owner: 'Tom Silva', time: '12:14', batch: 'B-1042', verified: false }
  ],
  correctiveActions: [
    { id: 1, trigger: 'Fridge 1 at 7°C', action: 'Discard high-risk dairy from batch B-1042 and re-check after thermostat reset.', status: 'open', linked: 'CCP Cold Storage' },
    { id: 2, trigger: 'Missed closing log on Friday', action: 'Manager verification required and refresher SOP attached.', status: 'in progress', linked: 'Closing Hygiene SOP' }
  ],
  verifications: [
    { id: 1, item: 'Opening hygiene check', by: 'Leah Byrne', reviewer: 'Mark O’Neill', status: 'needs review' },
    { id: 2, item: 'Freezer A temperature', by: 'Tom Silva', reviewer: 'Mark O’Neill', status: 'approved' }
  ],
  audits: [
    { id: 1, name: 'Weekly truck hygiene audit', score: '92%', when: 'Fri 17:00', status: 'scheduled' },
    { id: 2, name: 'Supplier traceability spot-check', score: '88%', when: 'Last Tue', status: 'complete' }
  ],
  documents: [
    { id: 1, name: 'Truck permit', type: 'Permit', expires: '2026-08-01', folder: 'Regulatory' },
    { id: 2, name: 'Food safety training — Leah', type: 'Training', expires: '2026-06-14', folder: 'Team' },
    { id: 3, name: 'Cleaning SOP v3', type: 'SOP', expires: 'Published', folder: 'Procedures' },
    { id: 4, name: 'PRP — Pest control', type: 'PRP', expires: 'Published', folder: 'Programs' }
  ],
  batches: [
    { id: 'B-1042', product: 'Chimichurri chicken', ingredient: 'Chicken thighs', supplier: 'GreenField Foods', qty: '24 portions', expiry: '2026-05-04', status: 'flagged' },
    { id: 'B-1041', product: 'Pickled slaw', ingredient: 'Cabbage mix', supplier: 'Fresh Lane Produce', qty: '30 portions', expiry: '2026-05-05', status: 'ok' }
  ],
  recipes: [
    { id: 1, name: 'Cinder Burger Sauce', allergens: 'Egg, mustard', yield: '2L', lastUpdated: '02 May' },
    { id: 2, name: 'Chimichurri Chicken Prep', allergens: 'None', yield: '24 portions', lastUpdated: '28 Apr' }
  ],
  haccp: {
    ccp: [
      { point: 'Cold storage', limit: '0–5°C', method: 'Probe temp twice daily', corrective: 'Isolate and discard high-risk food if breached' },
      { point: 'Hot holding', limit: '63°C+', method: 'Probe each service block', corrective: 'Reheat once or discard' }
    ],
    prps: ['Cleaning & sanitation', 'Waste handling', 'Allergen controls', 'Supplier approval'],
    sops: ['Opening hygiene SOP', 'Close-down SOP', 'Probe calibration SOP'],
    flow: ['Receiving', 'Cold storage', 'Prep', 'Cooking', 'Hot hold', 'Service', 'Waste']
  },
  integrations: [
    { name: 'IoT temperature sensors', status: 'planned' },
    { name: 'POS order sync', status: 'planned' },
    { name: 'Google Drive export', status: 'mocked' },
    { name: 'Accounting sync', status: 'planned' }
  ]
};

const fmt = {
  status(s){ return s === 'due' ? 'amber' : s === 'attention' ? 'red' : s === 'complete' || s === 'approved' || s === 'ok' ? 'green' : 'blue'; },
  label(s){ return s.replace(/(^.|\b.)/g, m => m.toUpperCase()); }
};

const qs = s => document.querySelector(s);
const qsa = s => Array.from(document.querySelectorAll(s));

function escapeHtml(text){return String(text).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function setTheme(theme){state.theme=theme;document.documentElement.setAttribute('data-theme',theme);}
function dueCount(){return state.tasks.filter(t=>t.status==='due'||t.status==='attention').length;}
function docExpiryCount(){return state.documents.filter(d=>String(d.expires).includes('2026-06')).length;}
function openDrawer(type='temp'){state.quickType=type;qs('#drawer').classList.add('show');qsa('[data-quick]').forEach(b=>b.classList.toggle('active',b.dataset.quick===type));qs('#quickName').focus();}
function closeDrawer(){qs('#drawer').classList.remove('show');qs('#quickName').value='';qs('#quickValue').value='';qs('#quickNotes').value='';}
function downloadText(filename, content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}
function navigate(page){state.currentPage=page;qsa('.page').forEach(p=>p.classList.toggle('active',p.id===`page-${page}`));qsa('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'});}

function renderDesktopSide(){
  qs('#desktopQuickNav').innerHTML = [
    ['Complete due checks','tasks'],['Add temperature log','logs'],['Open documents','documents'],['Traceability & HACCP','more']
  ].map(([label,page])=>`<button class="btn-ghost" style="text-align:left;justify-content:flex-start" onclick="navigate('${page}')">${label}</button>`).join('');
  qs('#desktopPulse').innerHTML = `
    <div class="mini-card"><strong>${dueCount()}</strong><span>Items needing attention</span></div>
    <div class="mini-card"><strong>${state.logs.length}</strong><span>Logs captured today</span></div>
    <div class="mini-card"><strong>${state.correctiveActions.filter(a=>a.status!=='resolved').length}</strong><span>Open corrective actions</span></div>
    <div class="mini-card"><strong>${docExpiryCount()}</strong><span>Documents expiring soon</span></div>`;
}

function renderHome(){
  const inspectionState = dueCount() === 0 ? 'Inspection-ready' : dueCount() === 1 ? 'Mostly ready' : 'Needs attention';
  qs('#page-home').innerHTML = `
    <section class="hero">
      <p class="eyebrow">${escapeHtml(state.truck.name)} · ${escapeHtml(state.truck.location)}</p>
      <h2>Make every service day feel calm, compliant, and ready for inspection.</h2>
      <p>Designed for food truck operators who need fast logging, visible risks, and proof on demand without a cluttered dashboard.</p>
      <div class="metrics">
        <div class="metric"><strong>${dueCount()}</strong><span>Needs attention</span></div>
        <div class="metric"><strong>${state.logs.length}</strong><span>Logs today</span></div>
        <div class="metric"><strong>${inspectionState}</strong><span>Inspection pulse</span></div>
      </div>
      <div class="cta-row">
        <button class="btn" onclick="navigate('tasks')">Complete due checks</button>
        <button class="btn-soft" onclick="openDrawer('temp')">Record temperature</button>
        <button class="btn-ghost" onclick="exportDailyReport()">Export proof</button>
      </div>
    </section>
    <section class="page-grid">
      <div class="card">
        <div class="section-head"><div><h3>Five things operators need most</h3><p>Built around the fastest daily actions for a busy shift.</p></div></div>
        <div class="list">
          ${[
            ['Due checks',`${dueCount()} items to clear before service`, 'tasks','A'],
            ['Temperature logs','Capture fridge, freezer, and hot-hold readings','logs','T'],
            ['Cleaning & hygiene','Fast completion with smart defaults','logs','C'],

function bindMoreTabs(){
  qsa('#moreTabs .tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
    qsa('#moreTabs .tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderMoreTab(btn.dataset.tab);

function filterLogs(query){
  const q = String(query).toLowerCase().trim();
  const rows = state.logs.filter(l => !q || [l.category,l.entry,l.value,l.owner,l.batch].join(' ').toLowerCase().includes(q));
  qs('#logRows').innerHTML = rows.map(l=>`<tr><td>${escapeHtml(l.category)}</td><td>${escapeHtml(l.entry)}</td><td>${escapeHtml(l.value)}</td><td>${escapeHtml(l.owner)}</td><td>${escapeHtml(l.time)}</td><td>${escapeHtml(l.batch)}</td><td>${l.verified?'Verified':'Pending'}</td></tr>`).join('') || '<tr><td colspan="7">No matching logs.</td></tr>';
}

function completeDueTask(){
  const item = state.tasks.find(t=>t.status==='due'||t.status==='attention');
  if(!item) return alert('All urgent tasks are already cleared.');
  item.status = 'complete';
  state.logs.unshift({id:Date.now(),category:item.type,entry:item.title,value:'Completed',owner:item.owner,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),batch:'-',verified:false});
  render();
}

function exportDailyReport(){
  const text = [
    'LogReady365 Daily Inspection Summary',
    `Truck: ${state.truck.name}`,
    `Location: ${state.truck.location}`,
    `Due items: ${dueCount()}`,
    `Logs today: ${state.logs.length}`,
    `Open corrective actions: ${state.correctiveActions.filter(a=>a.status!=='resolved').length}`,
    '', 'Recent logs:',
    ...state.logs.slice(0,8).map(l=>`- ${l.time} | ${l.category} | ${l.entry} | ${l.value} | ${l.owner}`)
  ].join('\n');
  downloadText('logready365-daily-report.txt', text);
}
function exportLogs(){ downloadText('logready365-monitoring-logbook.txt', state.logs.map(l=>`${l.time} | ${l.category} | ${l.entry} | ${l.value} | ${l.owner} | ${l.batch}`).join('\n')); }
function exportDocumentPack(){ downloadText('logready365-document-pack.txt', state.documents.map(d=>`${d.folder} | ${d.type} | ${d.name} | ${d.expires}`).join('\n')); }
function exportHaccp(){ downloadText('logready365-haccp-pack.txt', JSON.stringify(state.haccp,null,2)); }
function exportAudit(){ downloadText('logready365-audit-summary.txt', state.audits.map(a=>`${a.name} | ${a.when} | ${a.score} | ${a.status}`).join('\n')); }

function saveQuickEntry(){
  const quickMap = {temp:'Temperature',clean:'Cleaning',hygiene:'Hygiene',batch:'Traceability'};
  const entry = qs('#quickName').value.trim();
  const value = qs('#quickValue').value.trim();
  const owner = qs('#quickOwner').value;
  const notes = qs('#quickNotes').value.trim();
  if(!entry || !value) return alert('Please add an entry name and value.');
  state.logs.unshift({id:Date.now(),category:quickMap[state.quickType],entry,value,owner,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),batch:state.quickType==='batch'?value:'-',verified:false});
  if(state.quickType==='temp' && /(^[6-9]|\d{2,})/.test(value.replace(/[^\d]/g,''))) {
    state.correctiveActions.unshift({id:Date.now()+1,trigger:`${entry} out of range`,action:'Immediate re-check, isolate affected high-risk food, and request manager review.',status:'open',linked:'CCP Cold Storage'});
  }
  closeDrawer();
  navigate('logs');
}

  renderDesktopSide();

  renderTasks();

  renderDocuments();
  renderMore();
}
